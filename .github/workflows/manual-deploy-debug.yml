name: Manual deploy branch (debug)

# Diagnostic version of Manual deploy branch that bypasses decentraland/oddish-action
# and runs the publish flow inline, on Node 24, with full verbose logging at every
# step. Auth is via npm Trusted Publishers (OIDC) — no NPM_TOKEN consumed.
#
# Prerequisite (npm side, done by a maintainer of @dcl/sites once):
#   https://www.npmjs.com/package/@dcl/sites/access -> Trusted Publishers -> Add
#     Provider:    GitHub Actions
#     Owner:       decentraland
#     Repository:  sites
#     Workflow:    manual-deploy-debug.yml
#     Environment: (leave empty)

on:
  workflow_dispatch:
    inputs:
      deploymentEnvironment:
        type: choice
        description: 'Deployment environment'
        required: true
        default: 'zone'
        options:
          - zone
          - today
      rolloutPercentage:
        description: 'Rollout percentage'
        required: true
        default: '100'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.compute-version.outputs.version }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24)
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Environment fingerprint
        env:
          REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "=== Runner ==="
          uname -a
          echo
          echo "=== Node / npm versions ==="
          node --version
          npm --version
          echo
          echo "=== git ref ==="
          echo "github.ref_name = ${REF_NAME}"
          echo "github.sha      = ${GIT_SHA}"
          echo "short sha       = $(git rev-parse --short HEAD)"
          echo "github.run_id   = ${RUN_ID}"
          echo
          echo "=== Root package.json (truncated) ==="
          node -e "const p=require('./package.json');console.log(JSON.stringify({name:p.name,version:p.version,homepage:p.homepage,scripts:Object.keys(p.scripts||{})},null,2))"

      - name: Verify OIDC environment is available
        run: |
          set +u
          echo "=== OIDC env vars injected by GitHub Actions ==="
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN missing - id-token: write permission is not active on this job"
            exit 1
          fi
          echo "ACTIONS_ID_TOKEN_REQUEST_URL   = ${ACTIONS_ID_TOKEN_REQUEST_URL}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN = ***REDACTED*** (${#ACTIONS_ID_TOKEN_REQUEST_TOKEN} chars)"
          echo
          echo "=== Requesting an OIDC token audience=npm:registry.npmjs.org (dry probe) ==="
          curl -sf \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | python3 -c "import sys,json; t=json.load(sys.stdin).get('value',''); print('token length:', len(t))" \
            || echo "(OIDC probe failed - npm publish below will reveal exact reason)"
          echo
          echo "=== npm view @dcl/sites collaborators (public, no auth) ==="
          npm view @dcl/sites collaborators --json 2>&1 || true
          echo
          echo "=== npm view @dcl/sites dist-tags (public, no auth) ==="
          npm view @dcl/sites dist-tags --json 2>&1 || true

      - name: Install
        run: npm install
        env:
          HUSKY: 0

      - name: Build
        run: npm run build

      - name: Compute deterministic snapshot version
        id: compute-version
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)

          LOCAL_BASE=$(node -p "require('./package.json').version.split('-')[0]")
          NPM_LATEST=$(npm view @dcl/sites version 2>/dev/null || echo "0.0.0")
          BASE_VERSION=$(node -e "
            const semver = require('semver');
            const local = '${LOCAL_BASE}';
            const npmLatest = '${NPM_LATEST}';
            if (semver.lt(local, npmLatest)) {
              const inc = semver.inc(npmLatest, 'patch');
              process.stdout.write(inc);
            } else {
              process.stdout.write(local);
            }
          ")
          NEW_VERSION="${BASE_VERSION}-${RUN_ID}.commit-${SHORT_SHA}"

          echo "LOCAL_BASE   = ${LOCAL_BASE}"
          echo "NPM_LATEST   = ${NPM_LATEST}"
          echo "BASE_VERSION = ${BASE_VERSION}"
          echo "NEW_VERSION  = ${NEW_VERSION}"

          node -e "
            const fs = require('fs');
            const path = './dist/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '${NEW_VERSION}';
            pkg.commit  = '${FULL_SHA}';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          "
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo
          echo "=== dist/package.json after write ==="
          cat ./dist/package.json

      - name: npm publish --dry-run
        working-directory: ./dist
        # No NODE_AUTH_TOKEN: publish runs via Trusted Publishers (OIDC).
        run: |
          echo "=== Tarball preview ==="
          npm pack --dry-run 2>&1 | tail -40
          echo
          echo "=== Dry-run publish ==="
          npm publish --provenance --access public --tag manual --dry-run --loglevel=verbose 2>&1 | tail -60

      - name: npm publish (real)
        working-directory: ./dist
        # No NODE_AUTH_TOKEN: publish runs via Trusted Publishers (OIDC).
        # Requires a Trusted Publisher entry for `manual-deploy-debug.yml` at
        # https://www.npmjs.com/package/@dcl/sites/access
        run: |
          echo "=== Real publish ==="
          npm publish --provenance --access public --tag manual --loglevel=verbose

      - name: Verify package on npm
        env:
          PACKAGE_VERSION: ${{ steps.compute-version.outputs.version }}
        run: |
          echo "=== Confirming version landed on the registry ==="
          for attempt in $(seq 1 20); do
            if npm view "@dcl/sites@${PACKAGE_VERSION}" version 2>/dev/null | grep -q "${PACKAGE_VERSION}"; then
              echo "Version ${PACKAGE_VERSION} visible on npm after attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt}: not visible yet, sleeping 5s"
            sleep 5
          done
          echo "Version never appeared on npm — publish may have lied"
          exit 1

      - name: Trigger GitLab CDN pipeline
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_CDN_DEPLOYER_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_CDN_DEPLOYER_URL }}
          PACKAGE_VERSION: ${{ steps.compute-version.outputs.version }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Triggering GitLab pipeline for @dcl/sites@${PACKAGE_VERSION}"
          HTTP_STATUS=$(curl -s -o /tmp/gitlab-response.json -w '%{http_code}' \
            -X POST "${GITLAB_URL}" \
            -F "token=${GITLAB_TOKEN}" \
            -F "ref=master" \
            -F "variables[PACKAGE_NAME]=@dcl/sites" \
            -F "variables[PACKAGE_DIST_TAG]=manual" \
            -F "variables[PACKAGE_VERSION]=${PACKAGE_VERSION}" \
            -F "variables[REGISTRY_URL]=https://registry.npmjs.org" \
            -F "variables[REPO]=sites" \
            -F "variables[REPO_OWNER]=decentraland" \
            -F "variables[COMMIT]=${SHORT_SHA}")
          echo "GitLab HTTP status: ${HTTP_STATUS}"
          echo "GitLab response body:"
          cat /tmp/gitlab-response.json || true
          echo
          if [ "${HTTP_STATUS}" -ge 400 ]; then
            echo "GitLab pipeline trigger failed"
            exit 1
          fi

  rollout:
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Wait for CDN propagation
        env:
          PACKAGE_NAME: '@dcl/sites'
          PACKAGE_VERSION: ${{ needs.build-and-publish.outputs.version }}
        run: |
          URL="https://cdn.decentraland.org/${PACKAGE_NAME}/${PACKAGE_VERSION}"
          echo "Polling ${URL} until the CDN serves the package..."
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -I "${URL}" || echo "000")
            if [ "${status}" -ge 200 ] && [ "${status}" -lt 400 ]; then
              echo "Package available in CDN (status ${status}) after attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt}: status ${status}, retrying in 15s..."
            sleep 15
          done
          echo "Timed out waiting for ${URL}"
          exit 1

      - name: Set Rollout
        uses: decentraland/set-rollout-action@26ead404b6944fd0ce0d087cc59fd817607454d6 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          ref: ${{ github.ref }}
          sha: ${{ github.sha }}

          packageName: '@dcl/sites'
          packageVersion: ${{ needs.build-and-publish.outputs.version }}

          deploymentPath: 'sites'
          deploymentEnvironment: ${{ github.event.inputs.deploymentEnvironment }}
          deploymentName: '_site'
          percentage: ${{ github.event.inputs.rolloutPercentage }}
