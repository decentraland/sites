name: CDN deploy

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Environment to promote to"
        required: true
        default: "today"
        options: [zone, today, org]
      version:
        description: "Version to put live. org requires a release (e.g. 1.4.0); zone and today also take a commit build (e.g. 1.4.0-commit-abc1234)."
        required: true
      percentage:
        description: "Rollout percentage"
        required: true
        default: "100"

# The KV update is read-modify-write, so one deploy at a time per repo.
concurrency:
  group: cdn-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
      - run: npm ci
        env:
          HUSKY: 0
      # scripts/prebuild.cjs derives both VITE_BASE_URL — the CDN path every
      # built asset is requested from — and the Sentry release name from
      # package.json's version. So it has to be the version this build will be
      # deployed under BEFORE `npm run build` runs, or the HTML points at a
      # prefix the bytes were never uploaded to. `<base>-commit-<sha7>` is the
      # version the action computes, passed back to it explicitly below so it
      # does not suffix an already-suffixed base.
      - id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          VERSION="${BASE}-commit-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("package.json"));p.version=process.argv[1];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")' "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          # Lets @sentry/vite-plugin upload source maps, so Sentry stack traces
          # resolve to TS instead of minified chunks. Skipped when absent.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # deployment-environments defaults to zone.
      - uses: decentraland/actions/cdn-deploy@main
        with:
          dist-path: ./dist
          version: ${{ steps.version.outputs.version }}

  stage-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    steps:
      # Checked out for the base version in package.json; nothing is built here.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: decentraland/actions/cdn-deploy@main
        with:
          version: ${{ github.event.release.tag_name }}
          # Copy the tagged commit's already-uploaded build into the tag prefix.
          copy-from-commit: "true"
          # Empty list stages the bytes without touching any KV record.
          deployment-environments: "[]"

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Required: GitHub evaluates this before the job starts and only then issues
    # the environment claim the broker checks for today and org.
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    steps:
      # No checkout: nothing is built and the bytes are already in S3, so the
      # package name cannot be read from package.json.
      - uses: decentraland/actions/cdn-deploy@main
        with:
          package-name: "@dcl/sites"
          version: ${{ inputs.version }}
          deployment-environments: ${{ inputs.environment }}
          percentage: ${{ fromJSON(inputs.percentage) }}
