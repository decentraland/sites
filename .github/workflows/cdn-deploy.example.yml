# =============================================================================
# EXAMPLE — how @dcl/sites would adopt decentraland/actions/cdn-deploy
# =============================================================================
#
# Illustration, not the live pipeline. INERT by default: every job is gated on
# the `CDN_DEPLOY_EXAMPLE_ENABLED` repo variable (unset), so merging this does
# not deploy anything or interfere with build-release.yml / set-rollout*.yml.
#
# The site builds its own artifact and hands the action a `dist-path`; the
# action authenticates to the cdn-deploy broker with a GitHub OIDC token, and
# the broker mints 15-minute credentials scoped to one `<package>/<version>/`
# prefix and writes the Cloudflare KV record.
# See https://github.com/decentraland/actions/tree/main/cdn-deploy
#
# NO CLOUDFLARE TOKEN AND NO IAM ROLE LIVE HERE. The broker holds both, and
# authorises this repository against @decentraland/definitions, which records
# that decentraland/sites owns @dcl/sites. All this job needs is
# `permissions: { id-token: write }`.
#
# To adopt:
#   1. Merge decentraland/actions#17, then pin @cdn-deploy-v1 once tagged.
#      Do not adopt before the broker is live in prd — this action has no
#      credentials of its own to fall back on.
#   2. One-time repo setup, in Settings → Environments: create `today` and
#      `org`. On each, set BOTH
#        - Required reviewers — who approves a promotion;
#        - Deployment branches and tags → "Protected branches only".
#      These are the whole control. GitHub auto-creates an environment with no
#      protection at all the first time a workflow names a missing one, and the
#      broker cannot tell that apart from an approved one. `zone` needs nothing.
#   3. Set the CDN_DEPLOY_EXAMPLE_ENABLED repo variable to `true`.
#   4. Delete build-release.yml, set-rollout.yml and set-rollout-manual.yml.
#
# What the broker enforces, which shapes the jobs below:
#   - `zone` is open: any version, no approval. It is the dev channel.
#   - `today` and `org` need (a) the job to declare a matching `environment:`,
#     and (b) a RELEASE version — anything ending `-commit-<sha7>` is refused.
#   - Where the job runs is deliberately not constrained, so a promotion is
#     dispatched by hand and names the release to put live. A rollback is the
#     same operation with an older version.
# =============================================================================

name: CDN deploy (example)

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Environment to promote to"
        required: true
        default: "today"
        options: [today, org]
      version:
        description: "Released version to put live, e.g. 1.4.0. Must be a release — a commit build is refused for today/org."
        required: true
      percentage:
        description: "Rollout percentage"
        required: true
        default: "100"

# One deploy at a time per repo — the KV update is read-modify-write.
concurrency:
  group: cdn-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # push -> build, upload under <base>-commit-<sha7>, and publish it to zone.
  # zone only: today and org are promoted deliberately, from the job below.
  # `deployment-environments` is omitted because zone is already the default.
  dev:
    if: ${{ github.event_name == 'push' && vars.CDN_DEPLOY_EXAMPLE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
      - run: npm ci && npm run build
      - uses: decentraland/actions/cdn-deploy@main
        with:
          dist-path: ./dist
          slack-webhook: ${{ secrets.ROLLOUTS_SLACK_WEBHOOK }}

  # release -> STAGE the tag's bytes in S3, with no KV write.
  #
  # No build and no upload: `copy-from-commit` tells the broker to server-side
  # copy the build the tagged commit already uploaded into <package>/<tag>/.
  # Without it, a `version` that is merely absent from S3 is an error rather
  # than being filled with whatever this commit happens to have built.
  #
  # A `release: published` run is on the tag ref, which the broker requires for
  # a copy: it derives the source from the token's own sha, so the bytes can
  # only come from the commit the tag points at. Checkout is still needed, for
  # the base version in package.json.
  stage-release:
    if: ${{ github.event_name == 'release' && vars.CDN_DEPLOY_EXAMPLE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: decentraland/actions/cdn-deploy@main
        with:
          version: ${{ github.event.release.tag_name }}
          copy-from-commit: "true"
          deployment-environments: "[]" # stage only — no KV write
          slack-webhook: ${{ secrets.ROLLOUTS_SLACK_WEBHOOK }}

  # manual -> promote an already-staged RELEASE to today or org.
  #
  # `environment:` is the load-bearing line. GitHub evaluates it, with any
  # required reviewers and the branch policy, BEFORE this job starts, and only
  # then puts an `environment` claim in the OIDC token. The broker refuses
  # today/org without a matching one, so an unapproved promotion never reaches
  # it. Without this line the job would be refused outright.
  #
  # No build, no upload, no checkout: the bytes are already in S3 and this only
  # repoints the KV. Rolling back is this same job with an older version.
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.CDN_DEPLOY_EXAMPLE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: decentraland/actions/cdn-deploy@main
        with:
          package-name: "@dcl/sites" # no checkout, so package.json cannot be read
          version: ${{ inputs.version }}
          deployment-environment: ${{ inputs.environment }}
          percentage: ${{ fromJSON(inputs.percentage) }}
          slack-webhook: ${{ secrets.ROLLOUTS_SLACK_WEBHOOK }}
