# =============================================================================
# EXAMPLE — how @dcl/sites would adopt the cdn-deploy reusable workflow
# =============================================================================
#
# Illustration, not the live pipeline. INERT by default: every job is gated on
# the `CDN_DEPLOY_EXAMPLE_ENABLED` repo variable (unset), so merging this does
# not deploy anything or interfere with build-release.yml / set-rollout*.yml.
#
# The reusable workflow does checkout + Node 24 + build + upload-to-S3 (GitHub
# OIDC) + Cloudflare KV, replacing the oddish -> static-sites-pipeline ->
# set-rollout relay. It is state-aware: it uploads when the version is not in
# S3, copies the commit's build for a release, or just repoints when already
# there. See https://github.com/decentraland/actions/tree/main/cdn-deploy
#
# To adopt:
#   1. Merge decentraland/actions#17, then pin @cdn-deploy-v1 once tagged.
#   2. One-time org setup (admin): secrets CF_KV_API_TOKEN, ROLLOUTS_SLACK_WEBHOOK;
#      variables CF_ACCOUNT_ID, CDN_DEPLOY_ROLE_ARN. (No per-repo config.)
#   3. Set the CDN_DEPLOY_EXAMPLE_ENABLED repo variable to `true`.
#   4. Delete build-release.yml, set-rollout.yml and set-rollout-manual.yml.
# =============================================================================

name: CDN deploy (example)

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Already-uploaded version (or release tag) to point at"
        required: true
      environment:
        type: choice
        description: "Target environment"
        required: true
        default: "org"
        options: [zone, today, org]
      percentage:
        description: "Rollout percentage"
        required: true
        default: "100"

jobs:
  # push -> build once, deploy dev + stg. package-name / deployment-path are
  # derived from the checked-out package.json. One upload; both envs repointed.
  dev-stg:
    if: ${{ github.event_name == 'push' && vars.CDN_DEPLOY_EXAMPLE_ENABLED == 'true' }}
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    uses: decentraland/actions/.github/workflows/cdn-deploy.yml@main
    with:
      deployment-environments: '["zone","today"]'
    secrets: inherit

  # release -> STAGE the build under the release tag, no KV change. No build:
  # the action copies the build the last master commit already uploaded.
  stage-release:
    if: ${{ github.event_name == 'release' && vars.CDN_DEPLOY_EXAMPLE_ENABLED == 'true' }}
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    uses: decentraland/actions/.github/workflows/cdn-deploy.yml@main
    with:
      package-name: "@dcl/sites" # no checkout, so name is explicit
      version: ${{ github.event.release.tag_name }}
      deployment-environments: "[]" # stage only — no KV
      build-command: "" # copy, don't build
    secrets: inherit

  # manual -> switch a chosen environment's KV to an already-staged version.
  switch:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.CDN_DEPLOY_EXAMPLE_ENABLED == 'true' }}
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    uses: decentraland/actions/.github/workflows/cdn-deploy.yml@main
    with:
      package-name: "@dcl/sites"
      version: ${{ github.event.inputs.version }}
      deployment-environments: ${{ format('["{0}"]', github.event.inputs.environment) }}
      percentage: ${{ fromJSON(github.event.inputs.percentage) }}
      build-command: ""
    secrets: inherit
