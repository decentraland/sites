# TEMPORARY, kept only for the cut-over to cdn-deploy.yml.
#
# The broker refuses to publish a version without a completion marker, and
# `.deploy-complete.json` is introduced by that migration — so no version
# currently in the CDN bucket has one, and none of them can be rolled out
# through the new path. Until @dcl/sites has been deployed through the broker
# often enough to have something to fall back to, this is the only way to
# repoint an environment at an existing version.
#
# It still goes the old way: set-rollout-action -> webhooks-receiver -> KV.
# That is the path cdn-deploy.yml replaces, which is exactly why this file has
# to go once it is no longer needed. Delete it, and drop the deploymentPath
# from here rather than trusting it, as definitions owns that now.
name: Set rollout by path - Manual

on:
  workflow_dispatch:
    inputs:
      packageVersion:
        description: 'NPM Version of the release (@dcl/sites)'
        required: true
        default: ''
      deploymentEnvironment:
        type: 'choice'
        description: 'Deployment environment'
        required: true
        default: 'zone'
        options:
          - zone
          - today
          - org
      rolloutPercentage:
        description: 'The percentage for this rollout'
        required: true
        default: '100'

jobs:
  set-manual-by-path-rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Set Rollout
        uses: decentraland/set-rollout-action@26ead404b6944fd0ce0d087cc59fd817607454d6 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          # Repo deployment info
          ref: ${{ github.event.ref }}
          sha: ${{ github.sha }}

          # CDN information
          packageName: '@dcl/sites'
          packageVersion: ${{ github.event.inputs.packageVersion }}

          # Rollout information
          deploymentPath: 'sites'
          deploymentEnvironment: ${{ github.event.inputs.deploymentEnvironment }}
          deploymentName: '_site'
          percentage: ${{ github.event.inputs.rolloutPercentage }}
