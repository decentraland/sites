name: Build and release

on:
  push:
    branches:
      - master
  release:
    types:
      - created
  # Manual branch deploy — replaces the standalone manual-deploy.yml so a single
  # workflow filename is used for all publish paths. With AWS OIDC there's no
  # npm Trusted Publisher constraint, but we keep the single-file convention
  # so auto and manual paths share permissions/role-assumption code.
  workflow_dispatch:
    inputs:
      deploymentEnvironment:
        type: choice
        description: 'Deployment environment'
        required: true
        default: 'zone'
        options:
          - zone
          - today
          - org
      rolloutPercentage:
        description: 'Rollout percentage'
        required: true
        default: '100'

jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      # Required for AWS OIDC — STS exchanges this token for short-lived AWS
      # credentials that authorize the S3 upload, no static keys involved.
      id-token: write
      contents: read
      # Required so set-rollout-action can create the rollout deployment record.
      deployments: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      package_name: ${{ steps.version.outputs.package_name }}

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # @v4.3.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4.0.1
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Compute deploy version
        # Replaces oddish's snapshot/release versioning. Releases use the git tag
        # as-is. Branch pushes use <package_base>-<run_id>.commit-<sha7>.
        id: version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name.replace('@dcl/', '')")
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            BASE=$(node -p "require('./package.json').version" | sed 's/-development$//')
            VERSION="${BASE}-${{ github.run_id }}.commit-${GITHUB_SHA:0:7}"
          fi
          echo "package_name=$PKG_NAME"      >> $GITHUB_OUTPUT
          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "s3_prefix=$PKG_NAME/$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying $PKG_NAME@$VERSION"

      - name: Install
        run: npm install
        env:
          HUSKY: 0

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        # AWS STS exchanges the GitHub OIDC token for temporary credentials.
        # The role's trust policy restricts who can assume it; no static keys.
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_SITES_DEPLOYER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: deploy-${{ steps.version.outputs.package_name }}-${{ github.run_id }}

      - name: Sync static assets to S3
        # Long cache for hashed assets (immutable filenames from the bundler),
        # short / no-cache for HTML so new deploys roll out without stale shells.
        run: |
          aws s3 sync ./dist \
            "s3://${{ vars.AWS_SITES_BUCKET }}/${{ steps.version.outputs.s3_prefix }}/" \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./dist \
            "s3://${{ vars.AWS_SITES_BUCKET }}/${{ steps.version.outputs.s3_prefix }}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

  rollout-auto-zone:
    # Auto-deploy from push to master rolls out to .zone at 100%.
    if: github.event_name == 'push'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Set rollout (zone)
        uses: decentraland/set-rollout-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
          packageName: "@dcl/${{ needs.build-release.outputs.package_name }}"
          packageVersion: ${{ needs.build-release.outputs.version }}
          deploymentPath: 'sites'
          deploymentEnvironment: 'zone'
          deploymentName: '_site'
          percentage: 100

  rollout-auto-today:
    # Auto-deploy from push to master also rolls out to decentraland.today at 100%.
    if: github.event_name == 'push'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Set rollout (today)
        uses: decentraland/set-rollout-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
          packageName: "@dcl/${{ needs.build-release.outputs.package_name }}"
          packageVersion: ${{ needs.build-release.outputs.version }}
          deploymentPath: 'sites'
          deploymentEnvironment: 'today'
          deploymentName: '_site'
          percentage: 100

  rollout-release-org:
    # Releases roll out to .org. Use set-rollout-manual.yml to advance the % gradually.
    if: github.event_name == 'release'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Set rollout (org)
        uses: decentraland/set-rollout-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
          packageName: "@dcl/${{ needs.build-release.outputs.package_name }}"
          packageVersion: ${{ needs.build-release.outputs.version }}
          deploymentPath: 'sites'
          deploymentEnvironment: 'org'
          deploymentName: '_site'
          percentage: 100

  rollout-manual:
    # Manual branch deploy via workflow_dispatch. Sets the rollout in whichever
    # environment was selected, at whichever percentage was provided.
    if: github.event_name == 'workflow_dispatch'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Set rollout (manual)
        uses: decentraland/set-rollout-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
          packageName: "@dcl/${{ needs.build-release.outputs.package_name }}"
          packageVersion: ${{ needs.build-release.outputs.version }}
          deploymentPath: 'sites'
          deploymentEnvironment: ${{ github.event.inputs.deploymentEnvironment }}
          deploymentName: '_site'
          percentage: ${{ github.event.inputs.rolloutPercentage }}
