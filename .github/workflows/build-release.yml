name: Build and release

on:
  push:
    branches:
      - master
  release:
    types:
      - created
  # Manual branch deploy — replaces the standalone manual-deploy.yml so a single
  # workflow filename is used for all publish paths. npm Trusted Publishers
  # allows only one publisher entry per package, so consolidating here lets
  # auto-deploys (push/release) and manual branch deploys (workflow_dispatch)
  # share the same OIDC trust configuration.
  workflow_dispatch:
    inputs:
      deploymentEnvironment:
        type: choice
        description: 'Deployment environment'
        required: true
        default: 'zone'
        options:
          - zone
          - today
      rolloutPercentage:
        description: 'Rollout percentage'
        required: true
        default: '100'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.publish.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Enable npm 11.x via corepack
        # npm Trusted Publishing requires npm CLI >= 11.5.1. Node 24 already ships
        # with npm 11 bundled, but we use corepack defensively to guarantee npm 11
        # regardless of the runner's toolcache state, matching the marketplace
        # pattern. The self-upgrade route (`npm install -g npm@11`) is known to
        # crash due to broken modules in the cached npm 10.x.
        run: |
          corepack enable npm
          corepack install -g npm@11
          npm --version

      - name: Set package.json version
        uses: decentraland/oddish-action@4334287e94bcb192de0c7d841fe80a9faedcf191 # PR #11 head: node24 runtime + TS 6 / @types/node 24
        with:
          deterministic-snapshot: true
          only-update-versions: true

      - name: Install
        run: npm install
        env:
          HUSKY: 0

      - name: Build
        run: npm run build
        env:
          # Lets @sentry/vite-plugin upload source maps for this release, so the
          # stack traces in Sentry resolve to TS instead of minified chunks. The
          # plugin is skipped when the token is absent, so a missing secret
          # degrades to the previous behaviour rather than failing the build.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Publish
        id: publish
        # Auth via npm Trusted Publishers (OIDC) — `id-token: write` is granted on
        # this job so oddish and npm 11 handle the OIDC handshake automatically.
        # Requires a Trusted Publisher entry for `build-release.yml` at
        # https://www.npmjs.com/package/@dcl/sites/access
        #
        # For workflow_dispatch (manual branch deploys), the build is published
        # under the `manual` dist-tag so it doesn't move `latest`. Auto-deploys
        # (push/release) publish without a custom tag.
        uses: decentraland/oddish-action@4334287e94bcb192de0c7d841fe80a9faedcf191 # PR #11 head: node24 runtime + TS 6 / @types/node 24
        with:
          cwd: './dist'
          deterministic-snapshot: true
          provenance: true
          registry-url: 'https://registry.npmjs.org'
          access: public
          custom-tag: ${{ github.event_name == 'workflow_dispatch' && 'manual' || '' }}
          branch-to-custom-tag: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
          gitlab-token: ${{ secrets.GITLAB_CDN_DEPLOYER_TOKEN }}
          gitlab-pipeline-url: ${{ secrets.GITLAB_CDN_DEPLOYER_URL }}

  rollout:
    # Only runs for manual branch deploys. Auto-deploys (push/release) trigger
    # `set-rollout.yml` separately via the GitLab `deployment_status` event.
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Wait for CDN propagation
        env:
          PACKAGE_NAME: '@dcl/sites'
          PACKAGE_VERSION: ${{ needs.build-and-publish.outputs.version }}
        run: |
          URL="https://cdn.decentraland.org/${PACKAGE_NAME}/${PACKAGE_VERSION}"
          echo "Polling ${URL} until the CDN serves the package..."
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -I "${URL}" || echo "000")
            if [ "${status}" -ge 200 ] && [ "${status}" -lt 400 ]; then
              echo "Package available in CDN (status ${status}) after attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt}: status ${status}, retrying in 15s..."
            sleep 15
          done
          echo "Timed out waiting for ${URL}"
          exit 1

      - name: Set Rollout
        uses: decentraland/set-rollout-action@26ead404b6944fd0ce0d087cc59fd817607454d6 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          ref: ${{ github.ref }}
          sha: ${{ github.sha }}

          packageName: '@dcl/sites'
          packageVersion: ${{ needs.build-and-publish.outputs.version }}

          deploymentPath: 'sites'
          deploymentEnvironment: ${{ github.event.inputs.deploymentEnvironment }}
          deploymentName: '_site'
          percentage: ${{ github.event.inputs.rolloutPercentage }}
